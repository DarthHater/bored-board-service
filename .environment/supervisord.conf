[supervisord]
nodaemon=true   
                        
[program:dlv]
command=dlv debug --headless --listen=:2345 --log
autostart=true
autorestart=true
; redirecting to supervisord's stdout, can redirect these to files instead
; stderr_logfile=/var/log/%(program_name)s.log
stderr_logfile=/dev/fd/1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:fresh]
command=fresh -c /go/src/github.com/DarthHater/bored-board-service/.environment/fresh_runner.conf
autostart=true
autorestart=true
stderr_logfile=/dev/fd/1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
